    ${facts.length?`<div class="card flat">${facts.map(([k,v])=>`<div class="kv"><span class="muted">${k}</span><b style="text-align:right;max-width:60%">${esc(v)}</b></div>`).join('')}</div>`:''}
    ${layoutHTML || '<p class="muted">No scorecard found for this course yet.</p>'}
    ${c.checks?.length?`<div class="tip" style="margin-top:4px"><div class="ic">🔎</div><div class="body"><div class="kicker">Card check</div><p>${esc(c.checks.join(' '))} The per-hole numbers are kept as printed; the printed totals on the card do not add up.</p></div></div>`:''}
    ${c.corrected?`<p class="small muted">Correction applied: ${esc(c.corrected)}.</p>`:''}
    ${c.missing?`<p class="small muted">Notes: ${esc(c.missing)}</p>`:''}
    ${c.sources?.length?`<details class="small muted"><summary>Sources</summary>${c.sources.map(u=>`<div><a href="${esc(u)}" target="_blank" rel="noopener" style="word-break:break-all">${esc(u)}</a></div>`).join('')}</details>`:''}
  </div>`;
}
function adoptCourse(catId, li){
  const c=catById(catId); const L=c.layouts[li]; if(!L) return;
  const id=`cat-${c.id}-${li}`; if(course(id)){ toast('Already in your courses'); return; }
  const n=L.holes; const obj={ id, name: c.layouts.length>1?`${c.name} · ${L.name}`:c.name, location:c.town||'', holes:n, par:L.par.slice(), hcp:L.hcp?.length?L.hcp.slice():null, hcpW:L.hcpW?.length?L.hcpW.slice():null, pace:L.pace?.length?L.pace.slice():null, tees:L.tees.map(t=>({name:t.name, color:t.color||'#f4f4f4', yards:t.yards.slice(), rating:t.rating??null, slope:t.slope??null, note:t.unit==='m'?'Card printed in metres':''})), lat:c.lat, lng:c.lng, latApprox:false, geomId:c.geomId||null, catalogId:c.id, layoutName:L.name, website:c.website||'', holeNotes:{}, createdAt:nowISO(), updatedAt:nowISO() };
  S.courses.push(obj); save(); syncCourse(obj); toast('Added to my courses'); go('courses',{pickedCat:null, pickedCourse:id, catalogView:false});
}

/* editor */
let E=null;
function newCourse(){ E={ id:'c-'+uid(), name:'', location:'', holes:18, par:Array(18).fill(4), hcp:Array(18).fill(null), pace:Array(18).fill(null), tees:[{name:'White', color:'#f4f4f4', yards:Array(18).fill(null), rating:null, slope:null}], lat:null, lng:null, holeNotes:{}, createdAt:nowISO(), updatedAt:nowISO() }; go('courses',{editCourse:true}); }
function editCourse(id){ E=structuredClone(course(id)); E.hcp=E.hcp||Array(E.holes).fill(null); E.pace=E.pace&&E.pace.length?E.pace:Array(E.holes).fill(null); go('courses',{editCourse:true}); }
function courseEditor(){
  const n=E.holes; const idx=[...Array(n).keys()];
  const numRow=(label, arr, key, sub)=>`<tr><td>${label}</td>${idx.map(i=>`<td><input inputmode="numeric" pattern="[0-9]*" value="${arr[i]??''}" oninput="edSet('${key}',${sub!=null?sub:'null'},${i},this.value)"></td>`).join('')}</tr>`;
  return `<div class="topbar"><button class="btn sm ghost" onclick="E=null;go('courses',{editCourse:false})">Cancel</button><button class="btn sm" onclick="saveCourse()">Save course</button></div>
  <div class="stack">
    <h1>${E.name?esc(E.name):'New course'}</h1>
    <div class="card stack">
      <label class="f">Course name<input class="inp" value="${esc(E.name)}" oninput="E.name=this.value" placeholder="The Links at Brunello"></label>
      <label class="f">Location<input class="inp" value="${esc(E.location||'')}" oninput="E.location=this.value" placeholder="Town, province"></label>
      <label class="f">Holes<div class="seg"><button class="${n===9?'on':''}" onclick="edHoles(9)">9</button><button class="${n===18?'on':''}" onclick="edHoles(18)">18</button></div></label>
      <div class="row"><label class="f grow">Latitude<input class="inp" inputmode="decimal" value="${E.lat??''}" oninput="E.lat=this.value===''?null:+this.value;E.latApprox=false" placeholder="44.66"></label><label class="f grow">Longitude<input class="inp" inputmode="decimal" value="${E.lng??''}" oninput="E.lng=this.value===''?null:+this.value" placeholder="-63.76"></label></div>
      <p class="small muted">Latitude and longitude are optional. They power the sunset check on the home screen.</p>
    </div>
    <div class="eyebrow">Card</div>
    <div class="grid-edit"><table><tr><th></th>${idx.map(i=>`<th>${i+1}</th>`).join('')}</tr>${numRow('Par',E.par,'par')}${numRow('HCP',E.hcp,'hcp')}${numRow('Pace (min)',E.pace,'pace')}</table></div>
    <div class="eyebrow">Tees</div>
    ${E.tees.map((t,ti)=>`<div class="card stack" style="gap:10px"><div class="row"><input class="inp grow" value="${esc(t.name)}" oninput="E.tees[${ti}].name=this.value" placeholder="Tee name"><input type="color" value="${t.color||'#ffffff'}" oninput="E.tees[${ti}].color=this.value" style="width:46px;height:46px;border:1.5px solid var(--line);border-radius:12px;background:var(--ground);padding:4px"><button class="btn sm danger" onclick="E.tees.splice(${ti},1);render()">Remove</button></div><div class="row"><label class="f grow">Course rating<input class="inp" inputmode="decimal" value="${t.rating??''}" oninput="E.tees[${ti}].rating=this.value===''?null:+this.value" placeholder="70.1"></label><label class="f grow">Slope<input class="inp" inputmode="numeric" value="${t.slope??''}" oninput="E.tees[${ti}].slope=this.value===''?null:+this.value" placeholder="125"></label></div><div class="grid-edit"><table><tr><th></th>${idx.map(i=>`<th>${i+1}</th>`).join('')}</tr>${numRow('Yards',t.yards,'tees',ti)}</table></div></div>`).join('')}
    <button class="btn outline block" onclick="E.tees.push({name:'',color:'#2a5bd7',yards:Array(E.holes).fill(null),rating:null,slope:null});render()">+ Add tee set</button>
  </div>`;
}
function edSet(key, sub, i, v){ const num=v===''?null:+v; if(key==='tees') E.tees[sub].yards[i]=num; else E[key][i]=num; }
function edHoles(n){ if(E.holes===n) return; const fit=a=>{ const b=a.slice(0,n); while(b.length<n) b.push(a===E.par?4:null); return b; }; E.holes=n; E.par=fit(E.par); E.hcp=fit(E.hcp); E.pace=fit(E.pace); E.tees.forEach(t=>t.yards=fit(t.yards)); render(); }
function saveCourse(){
  if(!E.name.trim()){ toast('Give the course a name'); return; }
  if(E.par.some(p=>!p||p<3||p>6)){ toast('Every hole needs a par between 3 and 6'); return; }
  if(!E.tees.length || E.tees.some(t=>!t.name.trim())){ toast('Every tee set needs a name'); return; }
  if(E.hcp.every(x=>x==null)) E.hcp=null; if(E.pace.every(x=>x==null)) E.pace=null;
  E.name=E.name.trim(); E.updatedAt=nowISO();
  const i=S.courses.findIndex(c=>c.id===E.id); if(i>=0) S.courses[i]=E; else S.courses.push(E);
  const saved=E; E=null; save(); syncCourse(saved); toast('Course saved'); go('courses',{editCourse:false, pickedCourse:saved.id});
}

/* ============================================================
   SETTINGS + backup
   ============================================================ */
function openSettings(){
  const s=S.settings;
  openSheet(`<h2>Settings</h2><div class="stack" style="margin-top:12px">
    <label class="f">Your name<input class="inp" value="${esc(s.name)}" onchange="S.settings.name=this.value.trim();save();syncSettings();render()"></label>
    <label class="f">Default tees<input class="inp" value="${esc(s.defaultTee)}" onchange="S.settings.defaultTee=this.value.trim();save();syncSettings()" placeholder="White"></label>
    <label class="f">Handicap index (optional, by hand)<input class="inp" inputmode="decimal" value="${s.handicap??''}" onchange="S.settings.handicap=this.value===''?null:+this.value;save();syncSettings()"></label>
    <label class="f">Units<div class="seg"><button class="${s.units!=='imperial'?'on':''}" onclick="S.settings.units='metric';save();syncSettings();openSettings()">kg · cm</button><button class="${s.units==='imperial'?'on':''}" onclick="S.settings.units='imperial';save();syncSettings();openSettings()">lb · ft/in</button></div></label>
    ${s.units==='imperial'
      ? `<div class="row"><label class="f grow">Weight (lb)<input class="inp" inputmode="decimal" value="${s.weightKg!=null?Math.round(s.weightKg/0.45359237):''}" placeholder="176" onchange="S.settings.weightKg=this.value===''?null:Math.round(+this.value*0.45359237*10)/10;save();syncSettings()"></label><label class="f grow">Height (ft)<input class="inp" inputmode="numeric" id="h-ft" value="${s.heightCm!=null?Math.floor(s.heightCm/2.54/12):''}" placeholder="5" onchange="setHeightImperial()"></label><label class="f grow">(in)<input class="inp" inputmode="numeric" id="h-in" value="${s.heightCm!=null?Math.round(s.heightCm/2.54-Math.floor(s.heightCm/2.54/12)*12):''}" placeholder="10" onchange="setHeightImperial()"></label></div>`
      : `<div class="row"><label class="f grow">Weight (kg)<input class="inp" inputmode="decimal" value="${s.weightKg??''}" placeholder="80" onchange="S.settings.weightKg=this.value===''?null:+this.value;save();syncSettings()"></label><label class="f grow">Height (cm)<input class="inp" inputmode="numeric" value="${s.heightCm??''}" placeholder="178" onchange="S.settings.heightCm=this.value===''?null:+this.value;save();syncSettings()"></label></div>`}
    <div class="row"><label class="f grow">Stride (${s.units==='imperial'?'in':'m'}, optional)<input class="inp" inputmode="decimal" value="${s.strideM!=null?(s.units==='imperial'?Math.round(s.strideM/0.0254):s.strideM):''}" placeholder="${s.units==='imperial'?Math.round(strideM()/0.0254):strideM()}" onchange="S.settings.strideM=this.value===''?null:(S.settings.units==='imperial'?Math.round(+this.value*0.0254*100)/100:+this.value);save();syncSettings()"></label><label class="f grow">Walking factor<input class="inp" inputmode="decimal" value="${s.walkFactor??1.4}" onchange="S.settings.walkFactor=+this.value||1.4;save();syncSettings()"></label></div>
    <p class="small muted">Steps = card yards × walking factor ÷ stride. Calories use the Compendium of Physical Activities MET values (carrying 4.3, push cart 4.5, power cart 3.5) × weight × hours. Both are estimates; the factor and stride are yours to tune.</p>
    <label class="f">Usual way round<div class="seg">${Object.entries(MODES).map(([k,m])=>`<button class="${(s.defaultMode||'walk-carry')===k?'on':''}" onclick="S.settings.defaultMode='${k}';save();syncSettings();segOn(this)">${m.short}</button>`).join('')}</div></label>
    <label class="f">Home for distances<div class="row"><input class="inp grow" value="${esc(s.homeName||'')}" placeholder="Halifax" onchange="S.settings.homeName=this.value.trim();save();syncSettings()"><button class="btn sm ghost" onclick="useMyLocation()">Use my location</button></div></label>
    <label class="f">Appearance<div class="seg">${[['system','Auto'],['light','Light'],['dark','Dark']].map(([v,l])=>`<button class="${s.theme===v?'on':''}" onclick="S.settings.theme='${v}';applyTheme();save();segOn(this)">${l}</button>`).join('')}</div></label>
    <label class="f">Tips during play<div class="seg"><button class="${s.tips?'on':''}" onclick="S.settings.tips=true;save();segOn(this)">On</button><button class="${!s.tips?'on':''}" onclick="S.settings.tips=false;save();segOn(this)">Off</button></div></label>
    <div class="divider"></div>
    <div class="sync ${SYNC.on?'on':''}"><i></i>${SYNC.status}</div>
    <div class="row"><button class="btn ghost block" onclick="exportData()">Back up</button><button class="btn ghost block" onclick="importSheet()">Restore</button></div>
    <button class="btn outline block" onclick="resetSheet()">Reset everything</button>
    <p class="small muted">Data stays on this device in the browser's storage${SYNC.on?', and syncs to your other devices through this page':''}. Back up before clearing browser data.</p>
  </div>`);
}
function applyTheme(){ const t=S.settings.theme; if(t==='system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',t); }
async function exportData(){
  const data=JSON.stringify({app:'fairway-notebook', version:1, exportedAt:nowISO(), settings:S.settings, courses:S.courses, teeTimes:S.teeTimes, rounds:S.rounds}, null, 1);
  const fn=`fairway-backup-${nowISO().slice(0,10)}.json`;
  try{ const dl = window.claude?.use ? await claude.use('downloads') : null; if(dl){ await dl.save({filename:fn, data}); toast('Backup saved'); return; } }catch(e){}
  try{ await navigator.clipboard.writeText(data); toast('Backup copied to the clipboard'); return; }catch(e){}
  openSheet(`<h2>Backup</h2><p class="small muted" style="margin:8px 0">Copy this text and keep it somewhere safe.</p><textarea class="inp" style="min-height:200px;font-size:12px">${esc(data)}</textarea>`);
}
function importSheet(){ openSheet(`<h2>Restore from backup</h2><p class="small muted" style="margin:8px 0">Paste the backup text. Rounds and courses are merged by id; newer copies win.</p><textarea class="inp" id="imp" style="min-height:160px;font-size:12px"></textarea><button class="btn block" style="margin-top:12px" onclick="importData()">Restore</button>`); }
function importData(){ try{ const d=JSON.parse($('#imp').value); if(d.app!=='fairway-notebook') throw 0; mergeIn(d); save(); closeSheet(); render(); toast('Restored'); pushAll(); }catch(e){ toast('That is not a Fairway Notebook backup'); } }
function mergeIn(d){
  const m=(local, remote)=>{ (remote||[]).forEach(x=>{ if(!x||!x.id) return; if(S.settings.tombstones.includes(x.id)) return; const i=local.findIndex(y=>y.id===x.id); if(i<0) local.push(x); else if((x.updatedAt||'')>(local[i].updatedAt||'')) local[i]=x; }); };
  m(S.courses,d.courses); m(S.rounds,d.rounds); m(S.teeTimes,d.teeTimes);
  if(d.settings && (d.settings.updatedAt||'')>(S.settings.updatedAt||'')){ const tomb=[...new Set([...S.settings.tombstones,...(d.settings.tombstones||[])])]; S.settings={...S.settings,...d.settings,tombstones:tomb}; }
  else if(d.settings?.tombstones){ S.settings.tombstones=[...new Set([...S.settings.tombstones,...d.settings.tombstones])]; }
  const tomb=new Set(S.settings.tombstones); S.courses=S.courses.filter(c=>!tomb.has(c.id)); S.rounds=S.rounds.filter(r=>!tomb.has(r.id)); S.teeTimes=S.teeTimes.filter(t=>!tomb.has(t.id));
}
function resetSheet(){ openSheet(`<h2>Reset everything?</h2><p class="muted" style="margin-top:8px">All rounds, courses and settings on this device are erased. Brunello is added back as the starter course.</p><div class="row" style="margin-top:16px"><button class="btn ghost block" onclick="closeSheet()">Keep my data</button><button class="btn danger block" onclick="(function(){localStorage.removeItem(KEY);location.reload();})()">Erase</button></div>`); }

/* ============================================================
   SYNC — artifact db when this page runs inside claude.ai; silent otherwise
   ============================================================ */
const SYNC={on:false, db:null, status:'Stored on this device only'};
async function initSync(){
  try{ if(!window.claude?.use) return; SYNC.db = await claude.use('db'); }catch(e){ SYNC.db=null; }
  if(!SYNC.db) return;
  try{
    const [cs, rs, st] = await Promise.all([SYNC.db.collection('courses').get(), SYNC.db.collection('rounds').get(), SYNC.db.doc('settings/main').get()]);
    const remote={ courses:cs.docs.map(d=>d.data()), rounds:rs.docs.map(d=>d.data()), settings: st.exists?st.data().settings:null, teeTimes: st.exists?st.data().teeTimes:[] };
    mergeIn(remote); save(); SYNC.on=true; SYNC.status='Synced with your other devices'; WX.cache={}; render();
    await pushAll(remote);
  }catch(e){ console.warn('sync', e); SYNC.status='Sync unavailable right now'; }
}
async function pushAll(remote){
  if(!SYNC.db) return; const seen = remote ? {c:new Map(remote.courses.map(x=>[x.id,x.updatedAt])), r:new Map(remote.rounds.map(x=>[x.id,x.updatedAt]))} : null;
  for(const c of S.courses){ if(!seen || (seen.c.get(c.id)||'')<(c.updatedAt||'')) await syncCourse(c); }
  for(const r of S.rounds){ if(!seen || (seen.r.get(r.id)||'')<(r.updatedAt||'')) await syncRound(r); }
  if(remote){ for(const id of S.settings.tombstones){ if(seen.c.has(id)) syncDelete('courses',id); if(seen.r.has(id)) syncDelete('rounds',id); } }
  syncSettings();
}
const strip = o => JSON.parse(JSON.stringify(o));
function syncCourse(c){ if(!SYNC.db) return; return SYNC.db.doc('courses/'+c.id).set(strip(c)).catch(e=>console.warn(e)); }
let rT={}; function syncRound(r){ if(!SYNC.db) return; clearTimeout(rT[r.id]); rT[r.id]=setTimeout(()=>SYNC.db.doc('rounds/'+r.id).set(strip(r)).catch(e=>console.warn(e)),600); }
let sT=null; function syncSettings(){ S.settings.updatedAt=nowISO(); if(!SYNC.db) return; clearTimeout(sT); sT=setTimeout(()=>SYNC.db.doc('settings/main').set({settings:strip(S.settings), teeTimes:strip(S.teeTimes), updatedAt:S.settings.updatedAt}).catch(e=>console.warn(e)),600); }
function syncDelete(kind,id){ if(!SYNC.db) return; SYNC.db.doc(kind+'/'+id).delete().catch(e=>console.warn(e)); }

/* ============================================================
   BOOT
   ============================================================ */
applyTheme();
if(S.ui.activeRound && !round(S.ui.activeRound)) S.ui.activeRound=null;
{ const b=course('brunello'); if(b && !b.geomId){ b.geomId='r12793289'; b.catalogId='brunello'; } }
if(!SCREENS[S.ui.tab]) S.ui.tab='home';
S.ui.editCourse=false; E=null;
render();
initSync();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && S.ui.tab==='home') render(); });
</script>
