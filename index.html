<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fairway Notebook</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fairway">
<meta name="theme-color" content="#2C7A4B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  color-scheme:light;
  --ground:#F2F4EF; --surface:#FFFFFF; --surface-2:#E9EDE6; --ink:#131D16; --muted:#5F6E64; --faint:#8E9B92; --line:#DCE2DA;
  --accent:#2C7A4B; --accent-deep:#1E5A37; --accent-soft:#DDEDE2; --on-accent:#FFFFFF;
  --under:#2A78D6; --under-soft:#DCE9F8; --over:#C24E2B; --over-soft:#F6E1D9; --amber:#B8801A; --amber-soft:#F7EAD0;
  --seq-1:#EAF1EC; --seq-2:#BFD9C8; --seq-3:#7DB894; --seq-4:#3F8F5E; --seq-5:#1E5A37;
  --shadow:0 10px 30px rgba(19,29,22,.10), 0 1px 2px rgba(19,29,22,.06);
  --radius:18px; --radius-sm:12px;
  --display:"Archivo", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --body:"Source Sans 3", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --nav-h:60px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0E1512; --surface:#172019; --surface-2:#1F2B23; --ink:#EDF2EC; --muted:#9AAA9F; --faint:#6E7F74; --line:#26332B;
    --accent:#5FC48C; --accent-deep:#8ADBAB; --accent-soft:#1E3628; --on-accent:#0E1512;
    --under:#5FA3EE; --under-soft:#1B2E44; --over:#E8825F; --over-soft:#3E2419; --amber:#E2B15B; --amber-soft:#3A2F16;
    --seq-1:#1B261F; --seq-2:#25412F; --seq-3:#31654A; --seq-4:#4C9A6E; --seq-5:#8ADBAB;
    --shadow:0 10px 30px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E1512; --surface:#172019; --surface-2:#1F2B23; --ink:#EDF2EC; --muted:#9AAA9F; --faint:#6E7F74; --line:#26332B;
  --accent:#5FC48C; --accent-deep:#8ADBAB; --accent-soft:#1E3628; --on-accent:#0E1512;
  --under:#5FA3EE; --under-soft:#1B2E44; --over:#E8825F; --over-soft:#3E2419; --amber:#E2B15B; --amber-soft:#3A2F16;
  --seq-1:#1B261F; --seq-2:#25412F; --seq-3:#31654A; --seq-4:#4C9A6E; --seq-5:#8ADBAB;
  --shadow:0 10px 30px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--ground);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.4;min-height:100dvh;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;margin:0;touch-action:manipulation}
input,select,textarea{font-size:16px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:28px;line-height:1.1}
h2{font-size:20px;line-height:1.15}
h3{font-size:16px}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--display);font-weight:700}
.tab{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.hide{display:none!important}

#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;background:var(--ground)}
@media (min-width:520px){#app{box-shadow:0 0 0 1px var(--line)}}
#view{padding:calc(14px + env(safe-area-inset-top)) 16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));min-height:100dvh}
.screen{animation:enter .26s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}

/* top bar */
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:16px}
.topbar h1{font-size:26px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06);border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px}
.iconbtn:active{transform:scale(.94)}

/* cards */
.card{background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.card.accent{background:var(--accent);color:var(--on-accent)}
.card.accent .eyebrow,.card.accent .muted{color:color-mix(in srgb,var(--on-accent) 75%,transparent)}
.card + .card{margin-top:0}
.card-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-title h2{font-size:17px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-family:var(--display);font-weight:700;font-size:16px;background:var(--accent);color:var(--on-accent);transition:transform .12s ease,filter .12s ease;white-space:nowrap}
.btn:active{transform:scale(.97);filter:brightness(.95)}
.btn.block{width:100%}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.outline{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--over-soft);color:var(--over)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;pointer-events:none}
.card.accent .btn{background:var(--on-accent);color:var(--accent-deep)}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:34px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:600;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s,border-color .15s}
.chip.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip .dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tiles.three{grid-template-columns:repeat(3,1fr)}
.tile{background:var(--surface);border-radius:var(--radius-sm);padding:12px 12px 10px;border:1px solid var(--line);animation:pop .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.tile .label{font-size:12px;color:var(--muted);margin-bottom:4px}
.tile .value{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;letter-spacing:-.02em}
.tile .sub{font-size:12px;color:var(--faint);margin-top:4px}
.tile .value.good{color:var(--accent)}
.tile .value.bad{color:var(--over)}

/* score markers (scorecard notation) */
.mark{display:inline-grid;place-items:center;width:30px;height:30px;font-family:var(--display);font-weight:700;font-size:15px;border-radius:50%}
.mark.eagle{box-shadow:0 0 0 2px var(--under),0 0 0 4px var(--surface),0 0 0 6px var(--under);color:var(--under)}
.mark.birdie{box-shadow:0 0 0 2px var(--under);color:var(--under)}
.mark.par{color:var(--ink)}
.mark.bogey{border-radius:5px;box-shadow:0 0 0 2px var(--over);color:var(--over)}
.mark.double{border-radius:5px;box-shadow:0 0 0 2px var(--over),0 0 0 4px var(--surface),0 0 0 6px var(--over);color:var(--over)}
.mark.empty{color:var(--faint)}

/* bottom nav */
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;pointer-events:none}
nav#nav .bar{pointer-events:auto;width:100%;max-width:480px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);position:relative}
nav#nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--display);font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--faint);transition:color .2s}
nav#nav button svg{width:22px;height:22px;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
nav#nav button.on{color:var(--accent)}
nav#nav button.on svg{transform:translateY(-2px)}
nav#nav .ind{position:absolute;top:-1px;height:2px;width:20%;background:var(--accent);transition:transform .3s cubic-bezier(.2,.8,.2,1);border-radius:2px}
nav#nav .badge{position:absolute;top:9px;right:22px;width:8px;height:8px;border-radius:50%;background:var(--over);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.6}}

/* sheet */
#sheet-host{position:fixed;inset:0;z-index:60;display:none}
#sheet-host.open{display:block}
#sheet-host .backdrop{position:absolute;inset:0;background:rgba(10,18,13,.45);animation:fade .2s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
#sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:up .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
#sheet.closing{animation:down .22s ease-in both}
@keyframes down{to{transform:translateY(100%)}}
#sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}

/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-family:var(--display);font-weight:600}
.inp{width:100%;min-height:46px;border:1.5px solid var(--line);background:var(--ground);border-radius:12px;padding:10px 12px;color:var(--ink);font-family:var(--body);font-size:16px}
.inp:focus{outline:none;border-color:var(--accent)}
textarea.inp{min-height:80px;resize:vertical}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:40px;border-radius:9px;font-family:var(--display);font-weight:700;font-size:14px;color:var(--muted);transition:background .18s,color .18s,box-shadow .18s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.on.left{color:var(--over)}.seg button.on.right{color:var(--over)}.seg button.on.hit{color:var(--accent)}

/* stepper */
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--ground);border:1.5px solid var(--line);border-radius:16px;padding:6px}
.stepper button{width:52px;height:52px;border-radius:12px;background:var(--surface);font-family:var(--display);font-size:26px;font-weight:600;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);display:grid;place-items:center;transition:transform .1s}
.stepper button:active{transform:scale(.92)}
.stepper .val{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;letter-spacing:-.03em;min-width:64px;text-align:center;font-variation-settings:"wdth" 88}
.stepper .val.big{font-size:56px}
.stepper .val.bump{animation:bump .28s cubic-bezier(.2,.8,.2,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.stepper .val.under{color:var(--under)}.stepper .val.over{color:var(--over)}
.mini{display:flex;align-items:center;justify-content:space-between;background:var(--ground);border:1.5px solid var(--line);border-radius:12px;padding:4px 4px 4px 12px;gap:6px}
.mini .t{font-size:13px;color:var(--muted);font-family:var(--display);font-weight:600}
.mini .c{display:flex;align-items:center;gap:2px}
.mini .c button{width:38px;height:38px;border-radius:9px;background:var(--surface);font-size:20px;font-family:var(--display);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.mini .c .v{min-width:26px;text-align:center;font-family:var(--display);font-weight:700;font-size:18px}

/* hole hero */
.hole-hero{background:var(--accent);color:var(--on-accent);border-radius:var(--radius);padding:16px 18px 14px;position:relative;overflow:hidden}
.hole-hero .bg{position:absolute;right:-20px;bottom:-40px;font-family:var(--display);font-weight:800;font-size:170px;line-height:1;opacity:.10;letter-spacing:-.06em;pointer-events:none;font-variation-settings:"wdth" 80}
.hole-hero .hnum{font-family:var(--display);font-weight:800;font-size:54px;line-height:.95;letter-spacing:-.04em;font-variation-settings:"wdth" 85}
.hole-hero .meta{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.hole-hero .meta div{display:flex;flex-direction:column;gap:1px}
.hole-hero .meta b{font-family:var(--display);font-size:18px;font-weight:700}
.hole-hero .meta span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.hole-hero .late{color:#FFD27A}
.hole-hero .topline{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hole-hero .topline .eyebrow{color:color-mix(in srgb,var(--on-accent) 75%,transparent)}
.hole-hero .runner{font-family:var(--display);font-weight:700;font-size:22px;text-align:right;line-height:1.1}
.hole-hero .runner small{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.progress{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin:4px 0}
.progress i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.holes-strip{display:flex;gap:4px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.holes-strip::-webkit-scrollbar{display:none}
.holes-strip button{flex:0 0 auto;width:34px;height:40px;border-radius:9px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-size:11px;color:var(--faint);gap:1px}
.holes-strip button b{font-size:14px;color:var(--ink)}
.holes-strip button.cur{border-color:var(--accent);background:var(--accent-soft)}
.holes-strip button.under b{color:var(--under)}.holes-strip button.over b{color:var(--over)}

/* tip card */
.tip{background:var(--amber-soft);border-left:4px solid var(--amber);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;animation:tipin .4s cubic-bezier(.2,.8,.2,1) both}
.tip.calm{background:var(--accent-soft);border-left-color:var(--accent)}
.tip.note{background:var(--under-soft);border-left-color:var(--under)}
@keyframes tipin{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.tip .ic{width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:var(--surface);display:grid;place-items:center;font-size:14px}
.tip .body{flex:1;min-width:0}
.tip .kicker{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.tip p{font-size:15px;line-height:1.35}
.tip .x{color:var(--muted);font-size:20px;line-height:1;padding:0 2px}

/* scorecard grid */
.sc-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.sc{border-collapse:collapse;font-family:var(--display);font-size:13px;min-width:100%}
table.sc th,table.sc td{padding:6px 0;text-align:center;min-width:36px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.sc th{font-weight:600;font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
table.sc th:first-child,table.sc td:first-child{text-align:left;padding-left:10px;position:sticky;left:0;background:var(--surface);min-width:64px;font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
table.sc tr.head th{background:var(--accent);color:var(--on-accent)}
table.sc tr.head th:first-child{background:var(--accent);color:var(--on-accent)}
table.sc td.tot{font-weight:700;background:var(--surface-2)}
table.sc tr:last-child td{border-bottom:0}
table.sc .mark{width:26px;height:26px;font-size:13px}
table.sc .fir.hit::after{content:"●";color:var(--accent)}
table.sc .fir.L::after{content:"◀";color:var(--over);font-size:10px}
table.sc .fir.R::after{content:"▶";color:var(--over);font-size:10px}
table.sc .gir.y::after{content:"●";color:var(--accent)}
table.sc .gir.n::after{content:"○";color:var(--faint)}

/* course editor grid */
.grid-edit{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.grid-edit table{border-collapse:collapse}
.grid-edit th,.grid-edit td{padding:3px;border-bottom:1px solid var(--line)}
.grid-edit th{font-family:var(--display);font-size:11px;color:var(--muted);font-weight:600;text-align:center}
.grid-edit th:first-child,.grid-edit td:first-child{position:sticky;left:0;background:var(--surface);text-align:left;padding-left:8px;min-width:78px;font-size:12px;font-family:var(--display);font-weight:600;color:var(--muted)}
.grid-edit input{width:46px;height:38px;border:1px solid var(--line);border-radius:8px;text-align:center;background:var(--ground);font-family:var(--display);font-weight:600}
.grid-edit input:focus{outline:none;border-color:var(--accent)}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:12px 14px;border:1px solid var(--line);text-align:left;width:100%;transition:transform .12s}
.item:active{transform:scale(.985)}
.item .lead{width:46px;height:46px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;color:var(--accent-deep);flex:0 0 46px;letter-spacing:-.02em}
.item .lead.under{background:var(--under-soft);color:var(--under)}
.item .lead.over{background:var(--over-soft);color:var(--over)}
.item .ttl{font-family:var(--display);font-weight:700;font-size:15px}
.item .sub{font-size:13px;color:var(--muted)}
.item .end{margin-left:auto;text-align:right;font-family:var(--display);font-weight:700;font-size:15px;white-space:nowrap}
.item .end small{display:block;font-weight:600;font-size:11px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--display);font-size:11px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.10}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .dot.pick{fill:var(--ink)}
.chart .par{stroke:var(--faint);stroke-width:1}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:110px 1fr 44px;align-items:center;gap:10px;font-size:14px}
.bar .track{height:14px;background:var(--surface-2);border-radius:0 4px 4px 0;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:0 4px 4px 0;width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar .fill.under{background:var(--under)}
.bar .v{font-family:var(--display);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.bar .n{color:var(--muted);font-size:13px}
.dist{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;height:120px}
.dist div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-family:var(--display);font-size:11px;color:var(--muted)}
.dist i{display:block;width:100%;max-width:28px;background:var(--accent);border-radius:4px 4px 0 0;transition:height .6s cubic-bezier(.2,.8,.2,1);min-height:2px}
.dist i.under{background:var(--under)}.dist i.over{background:var(--over)}
.dist b{color:var(--ink);font-size:13px}
.heat{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.heat div{aspect-ratio:1;border-radius:6px;display:grid;place-items:center;font-family:var(--display);font-size:11px;font-weight:700;color:var(--ink);background:var(--seq-1);position:relative}
.heat div small{position:absolute;top:2px;left:4px;font-size:8px;font-weight:600;color:var(--muted)}

/* countdown */
.count{display:flex;gap:10px}
.count div{flex:1;text-align:center;background:color-mix(in srgb,var(--on-accent) 14%,transparent);border-radius:12px;padding:8px 4px}
.count b{display:block;font-family:var(--display);font-weight:800;font-size:28px;line-height:1;letter-spacing:-.02em}
.count span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.daylight{margin-top:12px}
.daylight .track{height:10px;border-radius:5px;background:linear-gradient(90deg,#FFD27A 0%,#F7A65A 60%,#6B4E9B 85%,#1C2447 100%);position:relative;overflow:visible}
.daylight .pin{position:absolute;top:-4px;width:18px;height:18px;border-radius:50%;background:var(--on-accent);transform:translateX(-50%);box-shadow:0 1px 3px rgba(0,0,0,.3);border:2px solid var(--accent)}
.daylight .lbl{display:flex;justify-content:space-between;font-size:11px;margin-top:6px;opacity:.85;font-family:var(--display)}
.check{display:flex;flex-direction:column;gap:6px}
.check label{display:flex;align-items:center;gap:10px;min-height:40px;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.check label.done{color:var(--faint);text-decoration:line-through}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:12px;font-family:var(--display);font-weight:600;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;z-index:70;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:80}

/* misc */
.divider{height:1px;background:var(--line);margin:4px 0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border-bottom:0}
.kv b{font-family:var(--display);font-weight:700}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty .big{font-size:36px;margin-bottom:8px}
.summary-score{font-family:var(--display);font-weight:800;font-size:72px;line-height:1;letter-spacing:-.04em;font-variation-settings:"wdth" 82}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-family:var(--display);font-weight:700;font-size:12px;background:var(--surface-2);color:var(--muted)}
.pill.under{background:var(--under-soft);color:var(--under)}.pill.over{background:var(--over-soft);color:var(--over)}.pill.good{background:var(--accent-soft);color:var(--accent-deep)}
.sync{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync.on i{background:var(--accent)}
/* maps */
.map{width:100%;height:auto;display:block;border-radius:12px;background:var(--map-ground)}
:root{--map-ground:#E4EBDD;--map-rough:#CDDCBF;--map-fairway:#9CCB7E;--map-green:#C8E6A6;--map-tee:#7FB86A;--map-sand:#EBDBA6;--map-water:#9CC4E4;--map-path:#B8B4A6;--map-line:#1E5A37;--map-club:#7A6A55}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--map-ground:#1C261D;--map-rough:#24331F;--map-fairway:#3E6B33;--map-green:#5E9A4E;--map-tee:#4E8342;--map-sand:#6C5F3B;--map-water:#2E4F6E;--map-path:#3E4A45;--map-line:#8ADBAB;--map-club:#6E6252}}
:root[data-theme="dark"]{--map-ground:#1C261D;--map-rough:#24331F;--map-fairway:#3E6B33;--map-green:#5E9A4E;--map-tee:#4E8342;--map-sand:#6C5F3B;--map-water:#2E4F6E;--map-path:#3E4A45;--map-line:#8ADBAB;--map-club:#6E6252}
.map .outline{fill:var(--map-rough);stroke:var(--map-line);stroke-opacity:.35;stroke-width:1.5}
.map .rough{fill:var(--map-rough)}.map .fairway{fill:var(--map-fairway)}.map .green{fill:var(--map-green);stroke:var(--map-line);stroke-opacity:.35;stroke-width:1}.map .tee{fill:var(--map-tee)}.map .bunker{fill:var(--map-sand)}.map .water{fill:var(--map-water)}.map .driving_range{fill:var(--map-fairway);opacity:.5}
.map .cartpath,.map .path{fill:none;stroke:var(--map-path);stroke-width:1.5;stroke-linecap:round}
.map .hole{fill:none;stroke:var(--map-line);stroke-width:1.2;stroke-dasharray:4 4;opacity:.6}
.map .clubhouse{fill:var(--map-club)}
.map text{font-family:var(--display);font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--map-ground);stroke-width:3px;stroke-linejoin:round}
.map .ring{fill:none;stroke:var(--map-line);stroke-opacity:.35;stroke-width:1;stroke-dasharray:2 3}
.map .ringlbl{font-size:9px;font-weight:600;fill:var(--muted)}
.map .pin{fill:var(--over);stroke:var(--surface);stroke-width:1.5}
.map .scale{stroke:var(--ink);stroke-width:2}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);font-family:var(--display)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* catalog */
.item .km{font-family:var(--display);font-weight:700;font-size:15px;white-space:nowrap}
.tag{display:inline-block;padding:2px 7px;border-radius:6px;font-family:var(--display);font-size:11px;font-weight:600;color:var(--muted);background:var(--surface-2);margin-right:4px}
.tag.map{color:var(--accent-deep);background:var(--accent-soft)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:10px;background:var(--surface-2);color:var(--ink);text-decoration:none;font-family:var(--display);font-weight:600;font-size:13px}
.links a.primary{background:var(--accent);color:var(--on-accent)}
figure.photo{margin:0;border-radius:var(--radius);overflow:hidden;background:var(--surface-2);box-shadow:var(--shadow)}
figure.photo img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
figure.photo figcaption{font-size:11px;color:var(--faint);padding:4px 10px;font-family:var(--display)}
.item .thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:0 0 56px;background:var(--surface-2)}
/* lexicon */
.lex dt{font-family:var(--display);font-weight:700;margin-top:10px}
.lex dd{margin:2px 0 0;color:var(--muted);font-size:15px}
.shop{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.shop .lead{width:44px;height:44px;border-radius:12px;background:var(--amber-soft);display:grid;place-items:center;font-size:20px;flex:0 0 44px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- Derived per-hole facts ---------- */
function holeFacts(r, i){
  const c = course(r.courseId); const h = r.holeData[i]; const hi = r.start + i;
  const par = c ? c.par[hi] : r.parSnapshot[i];
  if(h.s==null) return {par, done:false};
  const toPar = h.s - par;
  const putts = h.p==null ? null : h.p;
  const gir = putts==null ? null : (h.s - putts) <= par - 2;
  const scr = gir===false ? (h.s <= par) : null;
  return {par, done:true, toPar, putts, gir, scramble:scr, fir:h.f, pen:h.pen||0, sand:h.sand||0, threePutt: putts!=null && putts>=3, onePutt: putts===1};
}
function roundTotals(r){
  const done = r.holeData.map((h,i)=>holeFacts(r,i)).filter(f=>f.done);
  const strokes = sum(done.map(f=>f.par + f.toPar));
  return { played: done.length, strokes, toPar: sum(done.map(f=>f.toPar)), putts: sum(done.map(f=>f.putts||0)), par: sum(done.map(f=>f.par)) };
}
function scoreClass(toPar){ return toPar<=-2?'eagle':toPar===-1?'birdie':toPar===0?'par':toPar===1?'bogey':'double'; }
function scoreName(toPar){ return toPar<=-3?'Albatross':toPar===-2?'Eagle':toPar===-1?'Birdie':toPar===0?'Par':toPar===1?'Bogey':toPar===2?'Double bogey':toPar===3?'Triple bogey':`+${toPar}`; }

/* ---------- Sun (NOAA / sunrise-equation, good to a minute or two) ---------- */
function sunset(date, lat, lng){
  const rad = Math.PI/180;
  const noon = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12);
  const n = Math.round(noon.getTime()/86400000 + 2440587.5 - 2451545);
  const Js = n - lng/360;
  const M = ((357.5291 + 0.98560028*Js) % 360 + 360) % 360;
  const C = 1.9148*Math.sin(M*rad) + 0.02*Math.sin(2*M*rad) + 0.0003*Math.sin(3*M*rad);
  const L = ((M + C + 180 + 102.9372) % 360 + 360) % 360;
  const Jt = 2451545 + Js + 0.0053*Math.sin(M*rad) - 0.0069*Math.sin(2*L*rad);
  const dec = Math.asin(Math.sin(L*rad)*Math.sin(23.4397*rad));
  const cosw = (Math.sin(-0.833*rad) - Math.sin(lat*rad)*Math.sin(dec)) / (Math.cos(lat*rad)*Math.cos(dec));
  if(cosw>1||cosw<-1) return null;
  const w = Math.acos(cosw)/rad;
  return new Date((Jt + w/360 - 2440587.5)*86400000);
}

/* confetti */
function confetti(n=90){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=$('#confetti'); const ctx=cv.getContext('2d'); cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; ctx.scale(devicePixelRatio,devicePixelRatio);
  const cols=['#2C7A4B','#2A78D6','#F2C14E','#C24E2B','#FFFFFF'];
  const ps=Array.from({length:n},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*0.45,vx:(Math.random()-.5)*9,vy:-Math.random()*11-4,r:Math.random()*5+3,c:cols[Math.random()*cols.length|0],a:Math.random()*Math.PI,va:(Math.random()-.5)*.3}));
  const t0=performance.now(); let done=false; const clear=()=>{ done=true; ctx.clearRect(0,0,innerWidth,innerHeight); };
  (function step(){ if(done) return; ctx.clearRect(0,0,innerWidth,innerHeight); ps.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.35; p.vx*=.99; p.a+=p.va; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6); ctx.restore(); }); if(performance.now()-t0<1900) requestAnimationFrame(step); else clear(); })();
  setTimeout(clear, 2400); // a backgrounded tab pauses frames; never leave stale confetti behind
}


/* ============================================================
   MAPS — drawn from OpenStreetMap golf features (© OpenStreetMap
   contributors, ODbL). Coordinates are metres east/south of the course centre.
   ============================================================ */
const MAP_KINDS = {rough:'rough', driving_range:'driving_range', fairway:'fairway', water_hazard:'water', lateral_water_hazard:'water', bunker:'bunker', green:'green', tee:'tee', clubhouse:'clubhouse', cartpath:'cartpath', path:'path', hole:'hole'};
const MAP_ORDER = ['rough','driving_range','fairway','water','bunker','green','tee','clubhouse','cartpath','path','hole'];
const ringsOf = f => Array.isArray(f.p[0][0]) ? f.p : [f.p];
const pathD = (rings, T) => rings.map(r=>'M'+r.map(p=>{const q=T(p);return q[0].toFixed(0)+','+q[1].toFixed(0);}).join('L')+(r.length>2?'Z':'')).join('');
function bounds(pts){ let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity; for(const [x,y] of pts){ if(x<x0)x0=x; if(y<y0)y0=y; if(x>x1)x1=x; if(y>y1)y1=y; } return {x0,y0,x1,y1}; }
function drawFeatures(feats, T, extra){ const layers={}; for(const f of feats){ const k=MAP_KINDS[f.k]; if(!k) continue; const d = (k==='hole'||k==='cartpath'||k==='path') ? 'M'+ringsOf(f)[0].map(p=>{const q=T(p);return q[0].toFixed(0)+','+q[1].toFixed(0);}).join('L') : pathD(ringsOf(f),T); (layers[k]=layers[k]||[]).push(`<path class="${k}" d="${d}"/>`); } return MAP_ORDER.map(k=>(layers[k]||[]).join('')).join('')+(extra||''); }
function holeLabels(feats, T){ return feats.filter(f=>f.k==='hole'&&f.ref).map(f=>{ const p=T(f.p[0]); return `<text x="${p[0].toFixed(0)}" y="${p[1].toFixed(0)}" font-size="11" text-anchor="middle" dy="4">${esc(f.ref)}</text>`; }).join(''); }
function courseMapSVG(g, opts={}){
  if(!g) return '';
  const pts=[...g.outline.flat(), ...g.f.flatMap(f=>ringsOf(f).flat())]; if(!pts.length) return '';
  const b=bounds(pts); const pad=40; const w=b.x1-b.x0+2*pad, h=b.y1-b.y0+2*pad; const T=p=>[p[0]-b.x0+pad, p[1]-b.y0+pad];
  const outline = g.outline.length ? `<path class="outline" d="${pathD(g.outline,T)}"/>` : '';
  const scale = `<g transform="translate(${(w-pad-100).toFixed(0)},${(h-14).toFixed(0)})"><line class="scale" x1="0" y1="0" x2="91.4" y2="0"/><text x="45" y="-4" font-size="9" text-anchor="middle">100 yd</text></g>`;
  const north = `<text x="${(pad/2).toFixed(0)}" y="18" font-size="11">N ↑</text>`;
  return `<svg class="map" viewBox="0 0 ${w.toFixed(0)} ${h.toFixed(0)}" role="img" aria-label="Course map">${outline}${drawFeatures(g.f,T)}${holeLabels(g.f,T)}${scale}${north}</svg>`;
}
function segDist(p,a,b){ const dx=b[0]-a[0], dy=b[1]-a[1]; const L=dx*dx+dy*dy; let t=L?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L:0; t=Math.max(0,Math.min(1,t)); const x=a[0]+t*dx, y=a[1]+t*dy; return Math.hypot(p[0]-x,p[1]-y); }
function nearLine(pts, line, tol){ for(const p of pts){ for(let i=1;i<line.length;i++){ if(segDist(p,line[i-1],line[i])<=tol) return true; } } return false; }
function holeMapSVG(g, n, opts={}){
  if(!g) return ''; const line = g.f.find(f=>f.k==='hole' && String(f.ref)===String(n)); if(!line) return '';
  const cen = f => centroid(ringsOf(f)[0]); const d2 = (p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1]);
  const greens=g.f.filter(f=>f.k==='green'), tees=g.f.filter(f=>f.k==='tee');
  const nearest=(pt,arr)=>arr.length?Math.min(...arr.map(f=>d2(cen(f),pt))):Infinity;
  let L=line.p.slice(); { // orient tee -> green using both ends: greens should sit at the end, tees at the start
    const s0=L[0], s1=L[L.length-1];
    const score=(nearest(s1,greens)-nearest(s0,greens)) + (nearest(s0,tees)-nearest(s1,tees));
    if(score>25) L.reverse();
  }
  const a=L[0], z=L[L.length-1]; const th=Math.atan2(z[1]-a[1], z[0]-a[0]); const phi=-Math.PI/2-th; const c=Math.cos(phi), sn=Math.sin(phi);
  const R=p=>[p[0]*c-p[1]*sn, p[0]*sn+p[1]*c];
  const green = greens.find(f=>String(f.ref||'')===String(n)) || greens.filter(f=>d2(cen(f),z)<=60).sort((p,q)=>d2(cen(p),z)-d2(cen(q),z))[0] || null;
  const gc = green ? cen(green) : z;
  const lineNear=(f,tol)=>nearLine(ringsOf(f).flat(), L, tol);
  const near = g.f.filter(f=>{ if(f===line||f.k==='hole'||f.k==='rough'||f.k==='driving_range'||f.k==='clubhouse') return false;
    if(String(f.ref||'')===String(n)) return true;
    if(f.k==='green') return f===green || segDist(cen(f),L[0],L[L.length-1])<=20;
    if(f.k==='tee') return d2(cen(f),a)<=55;
    if(f.k==='fairway') return L.some(p=>d2(cen(f),p)<=90) || (segDistLine(cen(f),L)<=45);
    if(f.k==='bunker') return lineNear(f,45) || d2(cen(f),gc)<=45;
    if(f.k==='water_hazard'||f.k==='lateral_water_hazard') return lineNear(f,60);
    if(f.k==='cartpath'||f.k==='path') return lineNear(f,40);
    return false; });
  const forBounds = near.filter(f=>f.k!=='cartpath'&&f.k!=='path');
  const pts=[...L, gc, ...forBounds.flatMap(f=>ringsOf(f).flat())].map(R); const b=bounds(pts); const pad=30; const w=Math.max(170,b.x1-b.x0+2*pad), h=b.y1-b.y0+2*pad+30; const ox=(w-(b.x1-b.x0))/2-b.x0; const T=p=>{const q=R(p); return [q[0]+ox, q[1]-b.y0+pad];};
  const G=T(gc); const rings=[100,150,200].map(y=>`<circle class="ring" cx="${G[0].toFixed(0)}" cy="${G[1].toFixed(0)}" r="${(y*0.9144).toFixed(0)}"/><text class="ringlbl" x="${(G[0]+4).toFixed(0)}" y="${(G[1]+y*0.9144-3).toFixed(0)}">${y}</text>`).join('');
  const teePt=T(a);
  const yards = line.dist ? `<text x="${(w/2).toFixed(0)}" y="${(h-10).toFixed(0)}" font-size="11" text-anchor="middle">${esc(line.dist)}</text>` : `<g transform="translate(${(w-pad-60).toFixed(0)},${(h-12).toFixed(0)})"><line class="scale" x1="0" y1="0" x2="45.7" y2="0"/><text x="23" y="-4" font-size="9" text-anchor="middle">50 yd</text></g>`;
  return `<svg class="map" viewBox="0 0 ${w.toFixed(0)} ${h.toFixed(0)}" role="img" aria-label="Hole ${n} map" style="max-height:${opts.maxH||360}px">${drawFeatures(near.concat([{k:'hole',p:L}]),T)}${rings}<circle class="pin" cx="${G[0].toFixed(0)}" cy="${G[1].toFixed(0)}" r="4"/><text x="${teePt[0].toFixed(0)}" y="${(teePt[1]+16).toFixed(0)}" font-size="11" text-anchor="middle">Tee</text>${yards}</svg>`;
}
function segDistLine(p, line){ let m=Infinity; for(let i=1;i<line.length;i++){ m=Math.min(m, segDist(p,line[i-1],line[i])); } return m; }
function centroid(ring){ let x=0,y=0; for(const p of ring){x+=p[0];y+=p[1];} return [x/ring.length,y/ring.length]; }
const geomFor = c => c && c.geomId && window.GEOM ? GEOM[c.geomId] : null;
const hasHoleMaps = g => !!(g && g.f.some(f=>f.k==='hole'&&f.ref));
const mapLegend = () => `<div class="legend"><span><i style="background:var(--map-fairway)"></i>Fairway</span><span><i style="background:var(--map-green)"></i>Green</span><span><i style="background:var(--map-sand)"></i>Sand</span><span><i style="background:var(--map-water)"></i>Water</span><span><i style="background:var(--map-tee)"></i>Tee</span></div>`;

    {id:'bogey-run', when:(f)=>f.bogeyRun>=3, k:'Three bogeys in a row', t:'Take one more club and aim for the centre of the green on the next two holes. Play for pars and let the run end.'},

function pickTip(list, ctx, shown){ const t=list.find(x=>(!x.when || x.when(ctx)) && !shown.has(x.id)); if(!t) return null; shown.add(t.id); return {...t, text: typeof t.t==='function'? t.t(ctx) : t.t}; }
function tipHTML(tip, dismiss){ if(!tip) return ''; return `<div class="tip ${tip.kind||''}" data-tip="${tip.id}"><div class="ic">${tip.kind==='note'?'📝':tip.kind==='calm'?'✅':'💡'}</div><div class="body"><div class="kicker">${esc(tip.k)}</div><p>${esc(tip.text)}</p></div>${dismiss?`<button class="x" aria-label="Dismiss tip" onclick="dismissTip('${dismiss}',this)">×</button>`:''}</div>`; }
function dismissTip(kind, el){ const r=S.ui.activeRound&&round(S.ui.activeRound); if(r){ if(kind==='after') r.pendingTip=null; if(kind==='hole'&&r.tipCache) r.tipCache.dismissed=true; save(); } el.closest('.tip').remove(); }
function holeHistory(courseId, hi, excludeRoundId){
  const rows=[]; for(const r of S.rounds){ if(r.courseId!==courseId || r.id===excludeRoundId || r.status!=='done') continue; const i=hi-r.start; if(i<0||i>=r.holeData.length) continue; const f=holeFacts(r,i); if(f.done) rows.push(f.toPar); }

}

function bestRound(courseId, n, excludeId){ const xs=S.rounds.filter(r=>r.status==='done'&&r.courseId===courseId&&r.holeData.length===n&&r.id!==excludeId).map(r=>roundTotals(r).toPar); return xs.length?Math.min(...xs):null; }
function saveRound(pb){ const r=round(S.ui.activeRound); if(!r) return; r.notes=$('#rnotes').value.trim(); r.status='done'; r.endedAt=nowISO(); r.updatedAt=nowISO(); r.pendingTip=null; r.effort=effort({yards:roundYards(r), mode:r.mode, minutes:roundMinutes(r)}); S.ui.activeRound=null; S.ui.hole=0; if(r.teeTimeId){ S.teeTimes=S.teeTimes.filter(t=>t.id!==r.teeTimeId); S.settings.tombstones.push(r.teeTimeId); syncSettings(); } save(); syncRound(r); closeSheet(); if(pb) setTimeout(()=>confetti(180),250); go('history',{pickedRound:r.id}); toast('Round saved'); }
function discardRound(){ const id=S.ui.activeRound; S.rounds=S.rounds.filter(r=>r.id!==id); S.settings.tombstones.push(id); S.ui.activeRound=null; S.ui.hole=0; save(); syncDelete('rounds',id); closeSheet(); go('home'); }


/* ============================================================
   EFFORT — steps and calories. MET values from the Compendium of
   Physical Activities (pacompendium.com/sports): 15265 walking carrying
   clubs 4.3, 15285 walking pulling clubs 4.5, 15290 power cart 3.5.
   Walking distance = card yards x walkFactor (a setting, default 1.4).
   Stride = strideM setting, else 0.415 x height, else 0.75 m.
   ============================================================ */
const MODES = { 'walk-carry':{label:'Walking, carrying', short:'Walk · carry', met:4.3, code:15265, walk:true}, 'walk-push':{label:'Walking, push cart', short:'Walk · push', met:4.5, code:15285, walk:true}, 'ride':{label:'Riding a cart', short:'Cart', met:3.5, code:15290, walk:false} };
function strideM(){ const s=S.settings; if(s.strideM) return s.strideM; if(s.heightCm) return Math.round(s.heightCm*0.415)/100; return 0.75; }
function effort({yards, mode, minutes}){
  const m = MODES[mode]||MODES['walk-carry']; const out={mode, label:m.label, met:m.met};
  if(m.walk && yards){ const distM = yards*0.9144*(S.settings.walkFactor||1.4); out.distanceKm=Math.round(distM/100)/10; out.steps=Math.round(distM/strideM()/100)*100; }
  if(S.settings.weightKg && minutes){ out.kcal=Math.round(m.met*S.settings.weightKg*(minutes/60)/10)*10; out.minutes=minutes; }
  return out;
}
function roundYards(r){ const c=course(r.courseId); const t=c&&teeOf(c,r.tee); if(!t) return null; const n=r.holeData.length; return sum(t.yards.slice(r.start,r.start+n)); }
function roundMinutes(r){ if(r.startedAt && r.endedAt){ const m=Math.round((new Date(r.endedAt)-new Date(r.startedAt))/60000); if(m>20 && m<600) return m; } const c=course(r.courseId); if(c?.pace?.length) return sum(c.pace.slice(r.start,r.start+r.holeData.length)); return r.holeData.length===9?135:270; }
function effortLine(e){ const bits=[]; if(e.steps) bits.push(`≈ ${e.steps.toLocaleString()} steps`); if(e.distanceKm) bits.push(S.settings.units==='imperial'?`${Math.round(e.distanceKm/1.609*10)/10} mi`:`${e.distanceKm} km`); if(e.kcal) bits.push(`≈ ${e.kcal} kcal`); if(!bits.length) bits.push(MODES[e.mode]?.walk?'Add your height and weight in Settings for steps and calories':'Add your weight in Settings for calories'); return bits.join(' · '); }
function modeSeg(cur, onpick){ return `<div class="seg">${Object.entries(MODES).map(([k,m])=>`<button class="${cur===k?'on':''}" onclick="${onpick.replace('%k',k)}">${m.short}</button>`).join('')}</div>`; }

/* ============================================================
   WEATHER — Open-Meteo when the page may call the network; otherwise a
   link to the Environment Canada forecast for the course and manual entry.
   ============================================================ */
const WMO = c => c===0?'Clear':c<=2?'Mostly clear':c===3?'Overcast':c<=48?'Fog':c<=57?'Drizzle':c<=67?'Rain':c<=77?'Snow':c<=82?'Showers':c<=86?'Snow showers':'Thunderstorms';
const wmoIcon = c => c===0?'☀️':c<=2?'🌤️':c===3?'☁️':c<=48?'🌫️':c<=67?'🌧️':c<=77?'🌨️':c<=82?'🌦️':c<=86?'🌨️':'⛈️';
const compass = d => ['N','NE','E','SE','S','SW','W','NW'][Math.round(((d%360)+360)%360/45)%8];
const WX={cache:{}, blocked:false};
async function getWeather(lat,lng){
  const key=`${lat.toFixed(2)},${lng.toFixed(2)}`; const hit=WX.cache[key]; if(hit && Date.now()-hit.at<30*60000) return hit.data;
  try{ const saved=JSON.parse(localStorage.getItem('fairway-wx.'+key)||'null'); if(saved && Date.now()-saved.at<30*60000){ WX.cache[key]=saved; return saved.data; } }catch(e){}
  if(!WX.blocked){ try{
    const ctl=new AbortController(); setTimeout(()=>ctl.abort(),6000);
    const res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&hourly=temperature_2m,precipitation_probability,precipitation,wind_speed_10m,wind_gusts_10m,wind_direction_10m,weather_code&daily=sunrise,sunset,temperature_2m_max,precipitation_probability_max&timezone=auto&forecast_days=3&wind_speed_unit=kmh`,{signal:ctl.signal});
    const data=await res.json(); const rec={at:Date.now(),data}; WX.cache[key]=rec; try{ localStorage.setItem('fairway-wx.'+key, JSON.stringify(rec)); }catch(e){} return data;
  }catch(e){ WX.blocked=true; } }
  // No network from here: read the forecast document kept in the artifact database (seeded by the daily refresh)
  try{ if(SYNC.db){ const snap=await SYNC.db.doc('weather/'+key.replace(',','_')).get(); if(snap.exists){ const d=snap.data(); const rec={at:Date.now(),data:{...d.data, fetchedAt:d.fetchedAt, fromDb:true}}; WX.cache[key]=rec; return rec.data; } } }catch(e){ console.warn('weather doc', e); }
  return null;
}
function wxAt(data, when){ if(!data?.hourly) return null; const h=data.hourly; const target=when.getTime(); let best=0, bd=Infinity; h.time.forEach((t,i)=>{ const d=Math.abs(new Date(t).getTime()-target); if(d<bd){bd=d;best=i;} }); if(bd>3*3600e3) return null; return {temp:h.temperature_2m[best], rain:h.precipitation_probability[best], mm:h.precipitation[best], wind:h.wind_speed_10m[best], gust:h.wind_gusts_10m[best], dir:h.wind_direction_10m[best], code:h.weather_code[best], time:h.time[best], fetchedAt:data.fetchedAt||null}; }
const ecLink = (lat,lng) => `https://weather.gc.ca/en/location/index.html?coords=${lat.toFixed(3)},${lng.toFixed(3)}`;
function wxStrip(w, lat, lng, when){
  const link=`<a class="btn sm ghost" href="${ecLink(lat,lng)}" target="_blank" rel="noopener">Forecast ↗</a>`;
  if(!w) return `<div class="row between wx"><span class="small muted">No forecast stored for this spot yet.</span>${link}</div>`;
  const fresh = w.fetchedAt ? ` · updated ${dayName(new Date(w.fetchedAt))} ${timeName(new Date(w.fetchedAt))}` : '';
  return `<div class="wx"><div class="row" style="gap:12px;align-items:center"><span style="font-size:28px">${wmoIcon(w.code)}</span><div class="grow"><b class="num" style="font-size:18px">${Math.round(w.temp)}°C · ${WMO(w.code)}</b><div class="small muted">Wind ${Math.round(w.wind)} km/h ${compass(w.dir)}${w.gust>w.wind+15?`, gusts ${Math.round(w.gust)}`:''} · rain ${w.rain}%${when?` · ${timeName(new Date(w.time))}`:''}${fresh}</div></div>${link}</div></div>`;
}
function windTip(w){ if(!w) return null; if(w.wind>=30) return {id:'wind-strong', k:'Strong wind', text:`Wind ${Math.round(w.wind)} km/h from the ${compass(w.dir)}. Into the wind: take two more clubs and swing easy. Downwind: one less club, the ball runs.`}; if(w.wind>=18) return {id:'wind', k:'Breezy', text:`Wind ${Math.round(w.wind)} km/h from the ${compass(w.dir)}. Aim to let the wind bring the ball back, and keep the flight low into it.`}; if(w.rain>=60) return {id:'rain', k:'Rain likely', text:'Wet grip is the round-killer. Keep a dry towel under the umbrella and change gloves at the turn.'}; return null; }

/* ============================================================
   STATS ENGINE
   ============================================================ */
function computeStats(rounds){
  const F=[]; rounds.forEach(r=>r.holeData.forEach((h,i)=>{ const f=holeFacts(r,i); if(f.done) F.push({...f, r, i}); }));
  const n=F.length; const st={rounds:rounds.length, holes:n};
  if(!n) return st;
  st.avgToParHole = avg(F.map(f=>f.toPar));
  const drive = F.filter(f=>f.par>3 && f.fir); st.firN=drive.length; st.fir = pct(drive.filter(f=>f.fir==='hit').length, drive.length); st.missL=pct(drive.filter(f=>f.fir==='L').length,drive.length); st.missR=pct(drive.filter(f=>f.fir==='R').length,drive.length);
  const withP = F.filter(f=>f.putts!=null); st.puttsN=withP.length;
  st.gir = pct(withP.filter(f=>f.gir).length, withP.length);
  st.puttsPerHole = avg(withP.map(f=>f.putts)); st.threePutt = pct(withP.filter(f=>f.threePutt).length, withP.length); st.onePutt=pct(withP.filter(f=>f.onePutt).length, withP.length);
  const miss = withP.filter(f=>f.gir===false); st.scramble = pct(miss.filter(f=>f.scramble).length, miss.length); st.scrN=miss.length;
  st.penPerRound = sum(F.map(f=>f.pen))/rounds.length; st.pen18 = sum(F.map(f=>f.pen))/n*18;
  st.sandN = sum(F.map(f=>f.sand));
  st.byPar = {}; [3,4,5].forEach(p=>{ const xs=F.filter(f=>f.par===p); st.byPar[p] = xs.length?{n:xs.length, avg:avg(xs.map(f=>f.toPar))}:null; });
  const bins={eagle:0,birdie:0,par:0,bogey:0,double:0,triple:0}; F.forEach(f=>{ const k=f.toPar<=-2?'eagle':f.toPar===-1?'birdie':f.toPar===0?'par':f.toPar===1?'bogey':f.toPar===2?'double':'triple'; bins[k]++; }); st.dist=bins;
  // strokes lost, per round
  st.lost = { threePutt: withP.filter(f=>f.threePutt).length/rounds.length, penalties: sum(F.map(f=>f.pen))/rounds.length, blowup: sum(F.map(f=>Math.max(0,f.toPar-1)))/rounds.length, missBogey: withP.filter(f=>f.gir===false && f.toPar>=1).length/rounds.length };
  st.best9 = bestOf(rounds,9); st.best18=bestOf(rounds,18);
  st.trend = rounds.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(r=>({id:r.id, date:r.date, ...roundTotals(r), n:r.holeData.length, course:r.courseName}));
  st.handicap = handicapEstimate(rounds);
  return st;
}
function bestOf(rounds,n){ const xs=rounds.filter(r=>r.holeData.length===n).map(r=>roundTotals(r)); if(!xs.length) return null; return xs.sort((a,b)=>a.toPar-b.toPar)[0]; }
function handicapEstimate(rounds){
  const diffs=[]; rounds.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(r=>{ const c=course(r.courseId); const t=c&&teeOf(c,r.tee); if(!t||!t.rating||!t.slope) return; const tot=roundTotals(r); if(tot.played<r.holeData.length) return; const n=r.holeData.length; const rating = n===9 ? t.rating/2 : t.rating; let d=(tot.strokes-rating)*113/t.slope; if(n===9) d*=2; diffs.push(d); });
  const last=diffs.slice(0,20); const k=last.length; if(k<3) return {n:k};
  const table={3:[1,-2],4:[1,-1],5:[1,0],6:[2,-1],7:[2,0],8:[2,0],9:[3,0],10:[3,0],11:[3,0],12:[4,0],13:[4,0],14:[4,0],15:[5,0],16:[5,0],17:[6,0],18:[6,0],19:[7,0],20:[8,0]};
  const [use,adj]=table[k]; const best=last.slice().sort((a,b)=>a-b).slice(0,use); return {n:k, index: Math.round((avg(best)+adj)*10)/10};
}
function insights(st){
  if(!st.holes) return [];
  const L=st.lost||{}; const out=[];
  if(L.threePutt>=0.5) out.push({score:L.threePutt, k:`Putting · about ${fmt1(L.threePutt)} three-putts a round`, t:'Practise lag putting from 30 feet. Goal: every first putt finishes inside a 3-foot circle.'});
  if(L.penalties>=0.5) out.push({score:L.penalties*1.2, k:`Penalties · about ${fmt1(L.penalties)} a round`, t:'Pick the safe side of every hole before you tee off, and take a shorter club when the hole is tight.'});
  if(L.blowup>=1) out.push({score:L.blowup, k:`Blow-up holes · about ${fmt1(L.blowup)} strokes a round beyond bogey`, t:'When a hole goes wrong, take your medicine: chip out sideways and play for bogey instead of the hero shot.'});
  if(st.gir!=null && st.gir<35 && st.puttsN>=9) out.push({score:1.5, k:`Approach play · ${st.gir}% greens in regulation`, t:'Aim at the middle of the green and take one more club. Most missed greens are short.'});
  if(st.scramble!=null && st.scramble<30 && st.scrN>=6) out.push({score:1.2, k:`Short game · ${st.scramble}% up and down`, t:'Spend half of each practice session chipping to one flag from 10 to 30 yards with one club.'});
  if(st.fir!=null && st.fir<40 && st.firN>=6) out.push({score:1, k:`Tee shots · ${st.fir}% fairways${st.missL>st.missR?`, mostly left`:st.missR>st.missL?`, mostly right`:''}`, t:'Tee the ball on the side of the trouble and aim away from it. A 3-wood in play beats a driver in the rough.'});
  if(!out.length) out.push({score:0, k:'Keep it going', kind:'calm', t:'Nothing is leaking strokes badly. Keep entering putts and fairways so the picture stays sharp.'});
  return out.sort((a,b)=>b.score-a.score);
}

SCREENS.history = () => {
  if(S.ui.pickedRound && round(S.ui.pickedRound)) return roundDetail(round(S.ui.pickedRound));
  const done = S.rounds.filter(r=>r.status==='done').sort((a,b)=>b.date.localeCompare(a.date));
  if(!done.length) return `<div class="topbar"><h1>History</h1></div><div class="card flat empty"><div class="big">📖</div><b>No rounds saved yet.</b><p class="small">Finish a round and its full scorecard lands here.</p></div>`;
  const groups={}; done.forEach(r=>{ const k=new Date(r.date).toLocaleDateString(undefined,{month:'long',year:'numeric'}); (groups[k]=groups[k]||[]).push(r); });
  return `<div class="topbar"><div><div class="eyebrow">${done.length} round${done.length>1?'s':''}</div><h1>History</h1></div></div><div class="stack">${Object.entries(groups).map(([k,rs])=>`<div class="eyebrow" style="margin-top:4px">${k}</div><div class="list">${rs.map(roundItem).join('')}</div>`).join('')}</div>`;
};
function openRound(id){ go('history',{pickedRound:id}); }
function scorecardHTML(r){
  const c=course(r.courseId); const tee=c?teeOf(c,r.tee):null; const n=r.holeData.length; const idx=[...Array(n).keys()];
  const halves = n===18 ? [[0,9],[9,18]] : [[0,n]];
  const cell=(i)=>{ const f=holeFacts(r,i); if(!f.done) return `<span class="mark empty">·</span>`; return `<span class="mark ${scoreClass(f.toPar)}">${f.par+f.toPar}</span>`; };
  const row=(label, fn, tot)=> `<tr><td>${label}</td>${halves.map(([a,b])=>idx.slice(a,b).map(i=>`<td>${fn(i)}</td>`).join('')+ (tot?`<td class="tot">${tot(a,b)}</td>`:'')).join('')}${halves.length>1&&tot?`<td class="tot">${tot(0,n)}</td>`:''}</tr>`;
  const facts=idx.map(i=>holeFacts(r,i));
  const strokes=(a,b)=>sum(facts.slice(a,b).filter(f=>f.done).map(f=>f.par+f.toPar))||'';
  return `<div class="sc-wrap"><table class="sc"><tr class="head"><th>Hole</th>${halves.map(([a,b])=>idx.slice(a,b).map(i=>`<th>${r.start+i+1}</th>`).join('')+`<th>${a===0?(n===18?'Out':'Tot'):'In'}</th>`).join('')}${halves.length>1?'<th>Tot</th>':''}</tr>
  ${tee?row('Yards',i=>tee.yards[r.start+i],(a,b)=>sum(tee.yards.slice(r.start+a,r.start+b))):''}
  ${row('Par',i=>facts[i].par,(a,b)=>sum(facts.slice(a,b).map(f=>f.par)))}
  ${c?row('HCP',i=>c.hcp[r.start+i]):''}
  ${row('Score',cell,strokes)}
  ${row('Putts',i=>facts[i].done&&facts[i].putts!=null?facts[i].putts:'',(a,b)=>sum(facts.slice(a,b).map(f=>f.putts||0))||'')}
  ${row('Fairway',i=>facts[i].done&&facts[i].par>3&&facts[i].fir?`<span class="fir ${facts[i].fir}" style="display:block"></span>`:'')}
  ${row('GIR',i=>facts[i].done&&facts[i].gir!=null?`<span class="gir ${facts[i].gir?'y':'n'}" style="display:block"></span>`:'')}
  </table></div>`;
}
function roundDetail(r){
  const c=course(r.courseId); const t=roundTotals(r); const st=computeStats([r]); const ins=insights(st).slice(0,2);
  return `<div class="topbar"><button class="btn sm ghost" onclick="go('history',{pickedRound:null})">‹ History</button><button class="btn sm ghost" onclick="roundMenu('${r.id}')">Options</button></div>
  <div class="stack">
    <div><div class="eyebrow">${dayName(new Date(r.date))} · ${timeName(new Date(r.date))}${r.endedAt?` – ${timeName(new Date(r.endedAt))}`:''}</div><h1>${esc(c?c.name:r.courseName)}</h1><div class="muted small">${r.holeData.length} holes · ${esc(r.tee)} tees${r.start?' · back nine':''}</div></div>
    <div class="card"><div class="row" style="align-items:flex-end;gap:14px"><div class="summary-score" style="color:${t.toPar<0?'var(--under)':t.toPar>0?'var(--over)':'var(--ink)'}">${t.strokes}</div><div><div class="num" style="font-size:24px">${signed(t.toPar)}</div><div class="muted small">par ${t.par} · ${t.played} holes scored</div></div></div>
    <div class="tiles three" style="margin-top:14px"><div class="tile" style="--i:0"><div class="label">Putts</div><div class="value">${t.putts}</div><div class="sub">${fmt1(st.puttsPerHole)} per hole</div></div><div class="tile" style="--i:1"><div class="label">Greens</div><div class="value">${st.gir==null?'–':st.gir+'%'}</div><div class="sub">in regulation</div></div><div class="tile" style="--i:2"><div class="label">Fairways</div><div class="value">${st.fir==null?'–':st.fir+'%'}</div><div class="sub">${st.scramble!=null?`scramble ${st.scramble}%`:''}</div></div></div></div>
    ${scorecardHTML(r)}
    <div class="card"><div class="card-title"><h2>Score mix</h2></div>${distHTML(st.dist)}</div>
    ${(()=>{ const e=r.effort||effort({yards:roundYards(r), mode:r.mode, minutes:roundMinutes(r)}); return `<div class="card flat"><div class="kv"><span class="muted">${MODES[r.mode]?.label||'Walking'} · ${mins(roundMinutes(r))} on course</span><b>${effortLine(e)}</b></div>${r.weather?`<div class="kv"><span class="muted">Weather</span><b>${esc(r.weather)}</b></div>`:''}</div>`; })()}
    ${ins.length?`<div class="stack" style="gap:8px">${ins.map(x=>`<div class="tip ${x.kind||''}"><div class="ic">🎯</div><div class="body"><div class="kicker">${esc(x.k)}</div><p>${esc(x.t)}</p></div></div>`).join('')}</div>`:''}
    <div class="card"><div class="card-title"><h2>Notes</h2><button class="btn sm ghost" onclick="editNotes('${r.id}')">Edit</button></div><p class="${r.notes?'':'muted'}">${r.notes?esc(r.notes):'No notes for this round.'}</p></div>
  </div>`;
}
function distHTML(d){ const keys=[['eagle','Eagle-','under'],['birdie','Birdie','under'],['par','Par',''],['bogey','Bogey','over'],['double','Double','over'],['triple','Triple+','over']]; const max=Math.max(1,...keys.map(k=>d[k[0]])); return `<div class="dist">${keys.map(([k,l,c])=>`<div><b>${d[k]||''}</b><i class="${c}" style="height:${Math.round(d[k]/max*80)}%"></i><span>${l}</span></div>`).join('')}</div>`; }
function editNotes(id){ const r=round(id); openSheet(`<h2>Round notes</h2><textarea class="inp" id="rnotes2" style="margin-top:12px;min-height:120px">${esc(r.notes||'')}</textarea><button class="btn block" style="margin-top:12px" onclick="(function(){const r=round('${id}');r.notes=$('#rnotes2').value.trim();r.updatedAt=nowISO();save();syncRound(r);closeSheet();render();})()">Save</button>`); }
function roundMenu(id){ openSheet(`<h2>Round options</h2><div class="stack" style="margin-top:12px"><button class="btn ghost block" onclick="resumeRound('${id}')">Edit scores</button><button class="btn danger block" onclick="deleteRound('${id}')">Delete round</button><button class="btn outline block" onclick="closeSheet()">Cancel</button></div>`); }

/* ============================================================
   STATS
   ============================================================ */
SCREENS.stats = () => {
  const all = S.rounds.filter(r=>r.status==='done').sort((a,b)=>a.date.localeCompare(b.date));
  const courses = [...new Set(all.map(r=>r.courseId))].map(id=>course(id)||{id,name:all.find(r=>r.courseId===id).courseName});
  let rs = S.ui.statsCourse==='all' ? all : all.filter(r=>r.courseId===S.ui.statsCourse);
  const f=S.ui.statsFilter; if(f==='5') rs=rs.slice(-5); if(f==='10') rs=rs.slice(-10);
  const st=computeStats(rs);
  const filters = `<div class="chips">${[['all','All rounds'],['10','Last 10'],['5','Last 5']].map(([v,l])=>`<button class="chip ${f===v?'on':''}" onclick="S.ui.statsFilter='${v}';save();render()">${l}</button>`).join('')}</div>${courses.length>1?`<div class="chips">${[{id:'all',name:'All courses'},...courses].map(c=>`<button class="chip ${S.ui.statsCourse===c.id?'on':''}" onclick="S.ui.statsCourse='${c.id}';save();render()">${esc(c.name)}</button>`).join('')}</div>`:''}`;
  if(!st.holes) return `<div class="topbar"><h1>Stats</h1></div><div class="stack">${all.length?filters:''}<div class="card flat empty"><div class="big">📈</div><b>Stats start after your first round.</b><p class="small">Enter score and putts on every hole and the app works out greens, scrambling and where strokes go.</p></div></div>`;
  const per18 = Math.round(st.avgToParHole*18*10)/10;

  const bar=(l,v,n,cls='')=> v==null?'':`<div class="bar"><span class="n">${l}</span><div class="track"><div class="fill ${cls}" data-w="${v}"></div></div><span class="v">${v}%</span></div>`;
  const parRows=[3,4,5].map(p=>{ const b=st.byPar[p]; return b?`<div class="tile" style="--i:${p}"><div class="label">Par ${p}s</div><div class="value ${b.avg>0?'bad':'good'}">${signed(Math.round(b.avg*100)/100)}</div><div class="sub">${b.n} holes</div></div>`:''; }).join('');
  const courseHeat = S.ui.statsCourse!=='all' || courses.length===1 ? heatHTML(rs) : '';
  const ins=insights(st);
  return `<div class="topbar"><div><div class="eyebrow">${st.rounds} round${st.rounds>1?'s':''} · ${st.holes} holes</div><h1>Stats</h1></div></div>

    <div class="tiles"><div class="tile" style="--i:0"><div class="label">Average to par</div><div class="value ${per18>0?'bad':'good'}">${signed(per18)}</div><div class="sub">per 18 holes</div></div><div class="tile" style="--i:1"><div class="label">Best</div><div class="value">${st.best9?st.best9.strokes:st.best18?st.best18.strokes:'–'}</div><div class="sub">${st.best9?`9 holes (${signed(st.best9.toPar)})`:''}${st.best9&&st.best18?' · ':''}${st.best18?`18: ${st.best18.strokes} (${signed(st.best18.toPar)})`:''}</div></div><div class="tile" style="--i:2"><div class="label">Putts per hole</div><div class="value">${fmt1(st.puttsPerHole)}</div><div class="sub">${st.puttsN} holes measured</div></div>${hcTile}</div>

    <div class="tiles three">${parRows}</div>
    ${(()=>{ const es=rs.map(r=>r.effort||effort({yards:roundYards(r), mode:r.mode, minutes:roundMinutes(r)})); const steps=sum(es.map(e=>e.steps||0)), kcal=sum(es.map(e=>e.kcal||0)), km=Math.round(sum(es.map(e=>e.distanceKm||0))*10)/10; const walked=rs.filter(r=>MODES[r.mode]?.walk).length; return (steps||kcal)?`<div class="tiles three"><div class="tile" style="--i:0"><div class="label">Steps on course</div><div class="value">${steps?steps.toLocaleString():'–'}</div><div class="sub">${walked} walked round${walked===1?'':'s'}</div></div><div class="tile" style="--i:1"><div class="label">Distance walked</div><div class="value">${km||'–'}</div><div class="sub">km, estimated</div></div><div class="tile" style="--i:2"><div class="label">Calories</div><div class="value">${kcal?kcal.toLocaleString():'–'}</div><div class="sub">kcal, estimated</div></div></div>`:''; })()}
    <div class="card"><div class="card-title"><h2>Score mix</h2><span class="small muted">${st.holes} holes</span></div>${distHTML(st.dist)}</div>
    ${courseHeat}

function trendSVG(tr){
  if(tr.length<2) return `<p class="muted small">One more round and the trend line appears.</p>`;
  const W=420,H=160,px=28,py=16; const ys=tr.map(t=>t.toPar); const lo=Math.min(0,...ys), hi=Math.max(0,...ys); const span=Math.max(4,hi-lo);
  const X=i=>px+(W-2*px)*i/(tr.length-1), Y=v=>py+(H-2*py)*(1-(v-lo)/span);
  const ticks=[]; const step=span>16?5:span>8?2:1; for(let v=Math.ceil(lo/step)*step; v<=hi; v+=step) ticks.push(v);
  const pts=tr.map((t,i)=>`${X(i)},${Y(t.toPar)}`); const path='M'+pts.join(' L');
  const area=`M${X(0)},${Y(lo)} L${pts.join(' L')} L${X(tr.length-1)},${Y(lo)} Z`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Score to par by round">${ticks.map(v=>`<line class="grid ${v===0?'par':''}" x1="${px}" x2="${W-px}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${px-6}" y="${Y(v)+4}" text-anchor="end">${signed(v)}</text>`).join('')}<path class="area" d="${area}"/><path class="line" d="${path}"/>${tr.map((t,i)=>`<circle class="dot" r="${i===tr.length-1?6:4.5}" cx="${X(i)}" cy="${Y(t.toPar)}" style="cursor:pointer" onclick="$('#trend-cap').textContent='${esc(dayName(new Date(t.date)))} · ${t.strokes} (${signed(t.toPar)}) · ${t.n} holes'"/><rect x="${X(i)-14}" y="0" width="28" height="${H}" fill="transparent" onclick="$('#trend-cap').textContent='${esc(dayName(new Date(t.date)))} · ${t.strokes} (${signed(t.toPar)}) · ${t.n} holes'"/>`).join('')}<text x="${X(tr.length-1)}" y="${Y(tr[tr.length-1].toPar)-10}" text-anchor="middle" style="fill:var(--ink);font-weight:700">${signed(tr[tr.length-1].toPar)}</text></svg>`;
}
function heatHTML(rs){
  if(!rs.length) return ''; const c=course(rs[0].courseId); if(!c) return '';
  const cells=[]; for(let hi=0;hi<c.holes;hi++){ const xs=[]; rs.forEach(r=>{ const i=hi-r.start; if(i>=0&&i<r.holeData.length){ const f=holeFacts(r,i); if(f.done) xs.push(f.toPar); } }); cells.push({hi, n:xs.length, avg:avg(xs)}); }
  const has=cells.filter(x=>x.n); if(!has.length) return '';
  const lvl=v=> v==null?'var(--seq-1)': v<=0?'var(--under-soft)': v<0.5?'var(--seq-2)': v<1?'var(--seq-3)': v<1.75?'var(--seq-4)':'var(--seq-5)';
  const worst=has.slice().sort((a,b)=>b.avg-a.avg)[0], best=has.slice().sort((a,b)=>a.avg-b.avg)[0];
  return `<div class="card"><div class="card-title"><h2>${esc(c.name)} by hole</h2><span class="small muted">avg to par</span></div><div class="heat">${cells.map(x=>`<div style="background:${lvl(x.avg)};color:${x.avg!=null&&x.avg>=1?'#fff':'var(--ink)'}"><small>${x.hi+1}</small>${x.n?signed(Math.round(x.avg*10)/10):''}</div>`).join('')}</div><p class="small muted" style="margin-top:10px">Toughest: hole ${worst.hi+1} (${signed(Math.round(worst.avg*10)/10)}) · Best: hole ${best.hi+1} (${signed(Math.round(best.avg*10)/10)})</p></div>`;
}

function haversine(a,b,c,d){ const R=6371, r=Math.PI/180; const x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
const kmFromHome = c => c.lat!=null ? Math.round(haversine(S.settings.homeLat||44.6488, S.settings.homeLng||-63.5752, c.lat, c.lng)) : null;
